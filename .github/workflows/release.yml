name: Release Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish BetterJungler Windows NSIS Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify Version Sync & Frontend
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Rust Format, Clippy & Tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path Cargo.lock) {
            cargo test --locked
          } else {
            cargo test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          node scripts/extract-changelog.mjs --out "$env:RUNNER_TEMP/release-notes.md"
          $body = Get-Content "$env:RUNNER_TEMP/release-notes.md" -Raw
          $delim = "EOF_$([guid]::NewGuid().ToString('N'))"
          "RELEASE_BODY<<$delim" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$delim" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check Optional Windows Authenticode Secrets
        id: cert_check
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCert = (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) -and (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD))
          "has_cert=$($hasCert.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare Optional Windows Authenticode Signing
        if: steps.cert_check.outputs.has_cert == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw 'signtool.exe not found in Windows Kits 10'
          }

          $signScriptPath = Join-Path $env:RUNNER_TEMP 'codesign.ps1'
          @(
            'param([Parameter(Mandatory=$true)][string]$Target)'
            "& '$signtool' sign /f `"`$env:WINDOWS_PFX_PATH`" /p `"`$env:WINDOWS_CERTIFICATE_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256 `"`$Target`""
            'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
          ) | Set-Content -Path $signScriptPath -Encoding utf8

          $configPath = Join-Path $env:RUNNER_TEMP 'authenticode.json'
          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = 'powershell'
                  args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $signScriptPath, '%1')
                }
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding utf8

          "WINDOWS_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_BUILD_ARGS=--config $configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Signed Windows NSIS Installer & Updater Manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          BETTERJUNGLER_COMMIT_SHA: ${{ github.sha }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BetterJungler ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ env.TAURI_BUILD_ARGS }}

      - name: Clean Up Temporary Signing Files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path "$env:RUNNER_TEMP\codesign.pfx", "$env:RUNNER_TEMP\codesign.ps1", "$env:RUNNER_TEMP\authenticode.json" -Force -ErrorAction SilentlyContinue
